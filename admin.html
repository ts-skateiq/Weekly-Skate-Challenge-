<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKATE IQ — Admin</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
  <script>
    // Inside the accountability app: hide links back to the standalone game; the app menu handles navigation.
    try { if (window.self !== window.top) document.documentElement.classList.add('embedded') } catch (e) { document.documentElement.classList.add('embedded') }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111111;
      --surface: #1a1b1a;
      --border: #2a2c2a;
      --text: #f4f5f3;
      --muted: #8b908a;
      --accent: #71a88a;
      --accent-dim: rgba(113,168,138,0.15);
      --danger: #e0705c;
      --radius: 10px;
      --font: "General Sans", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
    }

    .login-card .wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: block;
    }

    .login-card h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"],
    input[type="url"] {
      width: 100%;
      background: #222422;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder,
    input[type="url"]::placeholder { color: var(--muted); }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus,
    input[type="url"]:focus { border-color: var(--accent); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .login-error {
      font-size: 13px;
      color: var(--danger);
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
    }

    /* ── Admin ── */
    #admin-screen {
      display: none;
      padding: 40px 20px 80px;
    }

    header {
      max-width: 740px;
      margin: 0 auto 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .btn-logout {
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 14px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .container { max-width: 740px; margin: 0 auto; }

    .week-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .week-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .week-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .week-date {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .trick-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .trick-row:last-child { margin-bottom: 0; }

    .trick-num {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      grid-column: 1 / -1;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .url-wrap { position: relative; }

    .url-wrap input { padding-left: 36px; }

    .url-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      opacity: 0.4;
    }

    /* ── Month nav ── */
    .month-nav {
      max-width: 740px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .month-nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 18px;
      font-weight: 500;
      padding: 12px 20px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .month-nav button:hover { color: var(--text); background: var(--accent-dim); }

    .month-nav .month-label {
      flex: 1;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
    }

    .actions {
      max-width: 740px;
      margin: 28px auto 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-save {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px 28px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
    }

    .btn-save:hover { opacity: 0.88; }

    .view-member-link {
      display: block; width: fit-content; margin: 16px 0 -6px auto;
      font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: 3px;
    }
    .view-member-link:hover { color: var(--accent); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    .status {
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .status.show { opacity: 1; }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }

    @media (max-width: 540px) {
      .trick-row { grid-template-columns: 1fr; }
    }
  .embedded .back-to-app, .embedded .wordmark { display: none !important; }
  .login-note { font-size: 14px; line-height: 1.5; color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body>

<!-- Shown when the admin is opened outside the accountability app, or the pass is rejected -->
<div id="login-screen">
  <div class="login-card">
    <span class="wordmark">Skate IQ</span>
    <h1>Game of Skate admin</h1>
    <p class="login-note" id="login-error">Sign in to the Skate IQ Accountability app as a coach, then open S.K.A.T.E. from the menu.</p>
  </div>
</div>

<!-- Admin -->
<div id="admin-screen">
  <header>
    <span class="wordmark">SKATE IQ</span>
    <h1>Game of Skate</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <a href="/" class="btn-logout back-to-app" style="text-decoration:none">← App</a>
      <button class="btn-logout back-to-app" onclick="logout()">Log out</button>
    </div>
  </header>

  <div class="month-nav">
    <button onclick="prevMonth()">‹</button>
    <span class="month-label" id="month-label"></span>
    <button onclick="nextMonth()">›</button>
  </div>

  <div class="container" id="schedule-form"></div>

  <div class="actions">
    <button class="btn-save" id="save-btn" onclick="save()">Save Schedule</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script>
let schedule = [];
let token = localStorage.getItem('admin_token');

const _now = new Date();
let currentYear  = _now.getFullYear();
let currentMonth = _now.getMonth(); // 0-indexed

function fmtDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getFridaysInMonth(year, month) {
  const fridays = [];
  const d = new Date(year, month, 1);
  while (d.getDay() !== 5) d.setDate(d.getDate() + 1);
  while (d.getMonth() === month) {
    fridays.push(d.toISOString().split('T')[0]);
    d.setDate(d.getDate() + 7);
  }
  return fridays;
}

function ensureMonthWeeks() {
  const fridays = getFridaysInMonth(currentYear, currentMonth);
  fridays.forEach(start => {
    if (!schedule.find(w => w.start === start)) {
      schedule.push({ start, tricks: Array.from({ length: 5 }, () => ({ name: '', url: '' })) });
    }
  });
  schedule.sort((a, b) => a.start.localeCompare(b.start));
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  render();
}

function render() {
  ensureMonthWeeks();

  const label = new Date(currentYear, currentMonth, 1)
    .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('month-label').textContent = label;

  const monthStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
  const monthWeeks = schedule.filter(w => w.start.startsWith(monthStr));

  const el = document.getElementById('schedule-form');
  el.innerHTML = monthWeeks.map((week) => {
    const gi = schedule.indexOf(week);
    return `
    <div class="week-card">
      <div class="week-header">
        <span class="week-label">Week of</span>
        <span class="week-date">${fmtDate(week.start)}</span>
      </div>
      ${week.tricks.map((trick, ti) => `
        <div class="trick-num">Trick ${ti + 1}</div>
        <div class="trick-row">
          <input type="text"
            placeholder="Trick name"
            value="${escHtml(trick.name)}"
            oninput="schedule[${gi}].tricks[${ti}].name = this.value; scheduleSave()"
          >
          <div class="url-wrap">
            <span class="url-icon">▶</span>
            <input type="url"
              placeholder="YouTube URL (optional)"
              value="${escHtml(trick.url)}"
              oninput="schedule[${gi}].tricks[${ti}].url = this.value; scheduleSave()"
            >
          </div>
        </div>
      `).join('')}
      <a class="view-member-link" href="/?view=member&week=${week.start}" onclick="stashPreview()">View as member</a>
    </div>
  `}).join('');
}

let _saveTimer = null;
function scheduleSave() {
  clearTimeout(_saveTimer);
  const status = document.getElementById('status');
  status.textContent = 'Unsaved…';
  status.className = 'status show';
  _saveTimer = setTimeout(save, 1200);
}

// The accountability app passes a short-lived signed pass in the URL hash (#pass=...). Trade it for a session.
async function appLogin(pass) {
  try {
    const res = await fetch('/api/app-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pass })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not allowed');
    token = data.token;
    localStorage.setItem('admin_token', token);
    showAdmin();
  } catch (e) {
    showLocked(e.message);
  }
}

function showLocked(message) {
  token = null;
  localStorage.removeItem('admin_token');
  if (message) document.getElementById('login-error').textContent = message;
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function logout() { showLocked(); }

async function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  await load();
}

// "View as member" previews the schedule as it is in this page, saved or not, without changing the live game.
function stashPreview() {
  try { sessionStorage.setItem('skateiq_preview_schedule', JSON.stringify(schedule)); } catch {}
}

async function save() {
  const btn = document.getElementById('save-btn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.className = 'status';

  try {
    const res = await fetch('/api/schedule', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-token': token || ''
      },
      body: JSON.stringify(schedule)
    });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) throw new Error();
    status.textContent = '✓ Saved';
    status.className = 'status show ok';
  } catch {
    status.textContent = 'Save failed — is the server running?';
    status.className = 'status show err';
  } finally {
    btn.disabled = false;
    setTimeout(() => status.className = 'status', 3000);
  }
}

async function load() {
  try {
    const res = await fetch('/api/schedule');
    schedule = await res.json();
    render();
  } catch {
    document.getElementById('schedule-form').innerHTML =
      '<p style="color:var(--danger);padding:20px">Could not load schedule — is the server running?</p>';
  }
}

// Startup: a pass from the app wins; otherwise reuse a session from earlier.
const _pass = new URLSearchParams(location.hash.slice(1)).get('pass');
if (_pass) {
  history.replaceState(null, '', location.pathname + location.search);
  appLogin(_pass);
} else if (token) {
  fetch('/api/session', { headers: { 'x-admin-token': token } })
    .then(r => (r.ok ? showAdmin() : showLocked()))
    .catch(() => showLocked());
} else {
  showLocked();
}
</script>
</body>
</html>
