<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Leaderboard — Skate IQ</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">
<script>
    // Inside the accountability app: the app's menu is the only menu, so hide the game's own header and menu.
    try { if (window.self !== window.top) document.documentElement.classList.add('embedded') } catch (e) { document.documentElement.classList.add('embedded') }
  </script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff;
    --surface: #f4f5f4;
    --border: #e6e6e6;
    --text: #111111;
    --muted: #6f6f6f;
    --accent: #71a88a;
    --gold: #C9A84C;
    --silver: #A0A9B8;
    --bronze: #A0694A;
    --make: #71A88A;
    --bail: #c0533f;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "General Sans", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 12px;
  }
  .back-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    padding: 4px 0;
  }
  .header-title {
    font-size: 15px;
    font-weight: 700;
    flex: 1;
  }

  /* Content */
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .week-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* Table */
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .rank {
    width: 24px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    flex-shrink: 0;
  }
  .rank.top { color: var(--text); }
  .user-info { flex: 1; min-width: 0; }
  .username {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    flex-shrink: 0;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  /* Black top bar, like the accountability app */
  .header { background: #111; color: #fff; border-bottom: 0; height: 64px; }
  button { font-family: inherit; }
  .embedded .header { background: #fff; color: var(--text); border-bottom: 1px solid var(--border); }
  /* Title centered, Back on the left */
  .header { display: grid; grid-template-columns: 1fr auto 1fr; }
  .header .back-btn { justify-self: start; }
  .header-title { text-align: center; }
  /* Rank and name on the left, score in the middle, emojis on the right. */
  .entry { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto minmax(0, 1fr); column-gap: 12px; }
  .emoji-score { font-size: 18px; letter-spacing: 2px; line-height: 1.2; white-space: nowrap; justify-self: end; }
  .entry .score-text { text-align: center; }
  .entry .rank, .entry .rank.top { color: var(--text); opacity: 0.35; }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="header-title">This Week's Leaderboard</div>
</header>

<div class="page">
  <div class="week-label" id="week-label">Loading…</div>
  <div id="board"><div class="loading">Loading…</div></div>
</div>

<script>
function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

async function load() {
  const res = await fetch('/api/leaderboard');
  const { entries, week } = await res.json();

  if (week) {
    document.getElementById('week-label').textContent = 'Week of ' + fmtDate(week);
  }

  const board = document.getElementById('board');
  if (!entries || entries.length === 0) {
    board.innerHTML = '<div class="empty">No scores submitted yet.<br>Be the first on the board!</div>';
    return;
  }

  board.innerHTML = entries.map((e, i) => `
      <div class="entry">
        <div class="rank ${i < 3 ? 'top' : ''}">${i + 1}</div>
        <div class="username">${escHtml(e.name)}</div>
        <div class="score-text">${e.makes}/${e.total}</div>
        <div class="emoji-score" aria-label="${e.makes} of ${e.total} made">${emojiScore(e.dots, e.total)}</div>
      </div>`).join('');
}

// One emoji per trick, pass or fail: 🟢 made, 🔴 anything else.
function emojiScore(dots, total) {
  const chars = dots ? [...dots] : [];
  return Array.from({ length: total }, (_, i) => chars[i] === '🟢' ? '🟢' : '🔴').join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
